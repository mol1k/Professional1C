<style>
/* Layout: one narrow exam column — header with progress strip, question card, answer list, explanation, nav */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --line:#D5D9D2; --ink:#1A1D1B; --muted:#5F665F;
  --accent:#E0A100; --accent-ink:#1A1D1B;
  --ok:#1E7A45; --ok-bg:#E3F3E8; --bad:#B4332A; --bad-bg:#F8E4E1; --idle:#C9CEC6;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121412; --surface:#1B1E1B; --line:#2D322D; --ink:#E7EAE5; --muted:#9AA197;
  --accent:#F2B81C; --accent-ink:#141412;
  --ok:#5CCB86; --ok-bg:#16301F; --bad:#F07A6E; --bad-bg:#3A1C19; --idle:#3A403A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121412; --surface:#1B1E1B; --line:#2D322D; --ink:#E7EAE5; --muted:#9AA197;
  --accent:#F2B81C; --accent-ink:#141412;
  --ok:#5CCB86; --ok-bg:#16301F; --bad:#F07A6E; --bad-bg:#3A1C19; --idle:#3A403A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{font-size:22px;font-weight:700;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0}
.stats{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:500}
.stats .s-ok b{color:var(--ok)} .stats .s-bad b{color:var(--bad)}
.strip{display:flex;flex-wrap:wrap;gap:3px}
.dot{width:14px;height:14px;border-radius:3px;background:var(--idle);border:0;padding:0;cursor:pointer}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px}
.dot:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
.qnum{font-family:var(--f-mono);font-size:13px;color:var(--muted);letter-spacing:.04em}
.qtext{font-size:18px;font-weight:600;margin:0;line-height:1.4;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;font:inherit;font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;
  padding:12px 14px 12px 44px;cursor:pointer;position:relative;line-height:1.4;transition:background .12s,border-color .12s}
.opt::before{content:attr(data-n);position:absolute;left:12px;top:11px;width:22px;height:22px;border-radius:5px;border:1px solid var(--line);
  font-family:var(--f-mono);font-size:12px;display:grid;place-items:center;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.opt.right::before{content:"✓";background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong::before{content:"✕";background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt.dim{opacity:.55}
.expl{border-left:3px solid var(--ok);padding:10px 14px;background:var(--bg);border-radius:0 8px 8px 0;font-size:15px}
.expl.bad{border-left-color:var(--bad)}
.expl strong{display:block;margin-bottom:4px}
.expl.good strong{color:var(--ok)} .expl.bad strong{color:var(--bad)}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:15px;padding:11px 20px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
.done{text-align:center;gap:10px}
.done .big{font-family:var(--f-mono);font-size:44px;font-weight:500;margin:0}
.done p{margin:0;color:var(--muted)}
.done .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.res{display:flex;flex-direction:column;gap:18px}
.res h3{margin:0;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.hist{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.hist td,.hist th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-size:12px;color:var(--muted);font-weight:500}
.hist td.num{font-family:var(--f-mono);text-align:right}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.hard{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.hard li{font-size:14px;display:flex;gap:10px;align-items:baseline}
.hard .cnt{font-family:var(--f-mono);color:var(--bad);white-space:nowrap}
.muted{color:var(--muted);font-size:14px;margin:0}
.hint{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion: reduce){.opt{transition:none}}

/* Telegram theme override */
html.tg body{background:var(--tg-theme-bg-color,var(--bg));color:var(--tg-theme-text-color,var(--ink))}
html.tg .card,html.tg .chip:not([aria-pressed="true"]),html.tg .btn:not(.primary){background:var(--tg-theme-secondary-bg-color,var(--surface));color:var(--tg-theme-text-color,var(--ink))}
html.tg .sub,html.tg .stats,html.tg .qnum,html.tg .hint{color:var(--tg-theme-hint-color,var(--muted))}
html.tg .hint{display:none}
html.tg .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
html.tg .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
</style>

<div class="wrap">
  <header>
    <div class="top">
      <div>
        <h1>Тема 1. Общие механизмы, понятия и термины</h1>
        <p class="sub">Все 77 вопросов модуля · ответы сверены с сайтом edu.uc.1c.ru</p>
      </div>
      <div class="stats" aria-live="polite">
        <span>Отвечено <b id="sAns">0</b>/<b id="sTot">0</b></span>
        <span class="s-ok">Верно <b id="sOk">0</b></span>
        <span class="s-bad">Ошибок <b id="sBad">0</b></span>
      </div>
    </div>
    <div class="strip" id="strip" aria-label="Вопросы"></div>
    <div class="controls">
      <button class="chip" id="mAll" aria-pressed="true">Все вопросы</button>
      <button class="chip" id="mBad" aria-pressed="false">Только ошибки</button>
      <button class="chip" id="mExam" aria-pressed="false">Экзамен: 14 случайных</button>
      <button class="chip" id="shuf" aria-pressed="false">Перемешивать варианты</button>
      <button class="chip" id="mRes" aria-pressed="false">Результаты</button>
      <button class="chip" id="reset">Начать заново</button>
    </div>
  </header>

  <main class="card" id="card"></main>
  <p class="hint">Клавиши: 1–6 — выбрать ответ, Enter или → — следующий вопрос, ← — назад.</p>
</div>

if (TG && TG.initData) {

  else document.documentElement.setAttribute('data-theme','light');
}
const haptic = ok => { try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred(ok?'success':'error'); } catch(e){} };
// sync progress through Telegram CloudStorage (phone <-> desktop)
function cloudSave(){ try{ if(TG && TG.CloudStorage) TG.CloudStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
function cloudLoad(cb){ try{ if(TG && TG.CloudStorage){ TG.CloudStorage.getItems([KEY, KEY+"_h"],(err,vals)=>{ if(!err && vals){ try{ const s=JSON.parse(vals[KEY]||"null"); if(s&&s.res) store=s; }catch(e){} try{ const h=JSON.parse(vals[KEY+"_h"]||"null"); if(h&&h.a) hist=h; }catch(e){} } cb(); }); return; } }catch(e){} cb(); }

const BANK = [{"q": "Какую конфигурацию можно изменять интерактивно в конфигураторе?", "o": ["Основная конфигурация", "Конфигурация базы данных", "Конфигурация поставщика", "Варианты 1 или 2", "Варианты 1 или 2 или 3"], "a": 0, "e": "Если в вариантах нет «Конфигурации расширения» — только основная. Конфигурация БД обновляется из основной (F7), конфигурация поставщика — только для чтения."}, {"q": "Для установки языка интерфейса прикладного решения пользователю, необходимо:", "o": ["в настройках пользователя выбрать возможный язык из списка дополнительных интерфейсов", "в настройках пользователя выбрать возможный язык из списка языков интерфейсов, заданных в ветви метаданных \"Языки\"", "в настройках пользователя выбрать возможный язык из списка предопределенных в платформе языков", "верны варианты 1 и 2", "верны все варианты"], "a": 1, "e": "Язык прикладного решения существует, только если он описан в конфигурации — в ветви «Общие → Языки». Своего списка языков для прикладного решения у платформы нет."}, {"q": "На компьютерах с какой операционной системой могут работать пользователи системы 1С:Предприятия 8.3?", "o": ["Windows", "Linux", "Mac OS X", "Варианты 1 и 2", "Варианты 1 и 2 и 3"], "a": 4, "e": "Клиент 8.3 работает на Windows, Linux и macOS."}, {"q": "Для использования механизма \"История данных\" (версионирование) требуется:", "o": ["определенным образом настроить объект конфигурации и подчиненные ему объекты", "выполнить настройку средствами встроенного языка системы", "Варианты 1 и 2 (требуется и настройка объекта конфигурации и выполнение настройки из встроенного языка)", "Варианты 1 или 2"], "a": 3, "e": "Ключевое слово — «или». Историю данных можно включить ЛИБО в конфигураторе у объекта, ЛИБО программно (ИсторияДанных.УстановитьНастройки). Оба шага сразу не обязательны."}, {"q": "Параметры сеанса инициируются:", "o": ["при запуске системы", "при первом программном обращении (в рамках сеанса)", "интерактивно при запуске системы", "Верны варианты 1 и 2", "Верны все варианты (в зависимости от настройки подключения к базе данных)"], "a": 3, "e": "Параметры сеанса заполняет только код — УстановкаПараметровСеанса: при запуске и при первом обращении к незаполненному параметру. Пользователь их никогда не вводит, поэтому «интерактивно» — неверно."}, {"q": "Для включения отборов в списках (управляемых форм) по содержимому табличных частей объектов и их свойств, неотображаемых в форме:", "o": ["реализуется произвольным запросом динамического списка", "осуществляется только с помощью дополнительной настройки форм", "необходимо создать объект критерии отбора", "ничего дополнительно настраивать не надо, все реализовано на уровне платформы"], "a": 3, "e": "В управляемых формах «Ещё → Настроить список → Отбор» сразу даёт поля табличных частей — платформа делает это сама."}, {"q": "Ограничен ли состав тех регистров учета, в которых документ может выступать в качестве регистратора движения?", "o": ["Да, ограничен специальным списком. Документ может выступать в качестве регистратора движения только у тех регистров, которые отмечены на закладке \"Движения\" окна редактирования объекта", "Да, ограничен типом регистра. Документ может выступать в качестве регистратора движения только в одном типе регистров (накопления или бухгалтерии или расчета)", "Да, ограничен. Документ может выступать в качестве регистратора движения только в одном регистре, который выбран на закладке движения окна редактирования объекта", "Нет, не ограничен. Документ может выступать в качестве регистратора движения в любых регистрах"], "a": 0, "e": "На закладке «Движения» документа галочками отмечаются регистры. Их может быть сколько угодно и любых типов, но только отмеченные."}, {"q": "Можно ли в 1С:Предприятии создать общий реквизит?", "o": ["Да, но только если включен режим разделения данных", "Да, но только если режим разделения данных отключен", "Да, можно", "Механизмы для создания общих реквизитов в платформе отсутствуют"], "a": 2, "e": "Общий реквизит создаётся без условий. Разделение данных — лишь один из режимов его использования."}, {"q": "С помощью какого свойства можно определить, какому документу принадлежит запись регистра?", "o": ["Специального свойства у записи регистра нет. Для этих целей можно определить у регистра реквизит типа \"ДокументСсылка\"", "Регистратор", "Документ", "ТекущийДокумент"], "a": 1, "e": "Регистратор — стандартный реквизит каждой записи регистра, подчинённого регистратору: ссылка на документ, сделавший движение."}, {"q": "Где определяется структура, прикладная логика, создаваемого бизнес-приложения в системе 1С:Предприятие 8?", "o": ["Конфигурация", "Информационная база", "СУБД", "Варианты 2 или 3 (в зависимости от варианта использования системы)"], "a": 0, "e": "«Структура», «логика» → конфигурация. От файлового или клиент-серверного варианта зависит только то, какая СУБД хранит данные."}, {"q": "Какое максимальное количество реквизитов документа позволяет определить система 1С:Предприятие 8?", "o": ["Количество реквизитов документа не ограничено", "Максимальное количество реквизитов ограничивается в свойстве \"Количество реквизитов\"", "Количество реквизитов документа не ограничено, но при этом реквизитов ссылочного типа не может быть больше 10", "Количество реквизитов зависит от варианта работы с информационной базой. В файловом - до 50, в клиент-серверном - неограниченно"], "a": 0, "e": "Платформа не ограничивает количество реквизитов. Остальные варианты — выдуманные ограничения."}, {"q": "Какие компоненты типовой поставки в системе 1С:Предприятие 8 защищены аппаратным ключом?", "o": ["Клиентское приложение", "Типовое решение фирмы 1С", "Сервер 1С:Предприятия", "Варианты 1 и 3", "Варианты1 и 2", "Верны все варианты"], "a": 3, "e": "Ключом защищена платформа: клиентские лицензии и сервер 1С. Типовая конфигурация (ERP, БП) ключом не защищена — без лицензии платформы она всё равно не запустится."}, {"q": "Для нечеткого поиска данных (с одной ошибкой) в механизме полнотекстового поиска используется выражение:", "o": ["~манолит", "манолит*", "\"манолит\"", "!манолит"], "a": 0, "e": "В 8.3 нечёткий поиск — тильда: ~ ищет слова с отличием на заданное число символов (по умолчанию 1). ! — синонимы, * — по началу слова, кавычки — точная фраза. В старых шпаргалках встречается # — это устаревший вариант."}, {"q": "Внешние обработки используются:", "o": ["На стадии отладки, для более быстрого внесения изменений в обработку", "Для разграничения прав доступа к обработке", "Для возможности редактирования/изменения функциональности обработки пользователем в режиме 1С:Предприятие", "Для реализации функциональности, не поставляемой с основной конфигурацией", "Варианты 1 и/или 3", "Варианты 1 и/или 4"], "a": 5, "e": "Внешняя обработка удобна для отладки (правишь без обновления конфигурации) и для функциональности, которой нет в поставке. Пользователь в режиме Предприятие код не редактирует, поэтому «1 и/или 3» — неверно."}, {"q": "Для запрета режима непосредственного удаления объектов пользователем необходимо...", "o": ["в свойствах конфигурации снять флаг \"Разрешить непосредственное удаление объектов\"", "при определении роли для соответствующих объектов снять отметку у флага \"Удаление\"", "при определении роли для соответствующих объектов снять отметку у флага \"Интерактивное удаление\"", "в свойствах роли снять отметку у флага \"Разрешить удаление объектов\"", "в свойствах роли снять отметку у флага \"Разрешить интерактивное удаление объектов\""], "a": 2, "e": "В роли два права: «Удаление» — из кода (Объект.Удалить()), «Интерактивное удаление» — пользователь удаляет из списка сам. Непосредственное удаление пользователем — второе. Флагов в свойствах конфигурации или роли для этого нет."}, {"q": "Как можно разделить список пользователей на группы?", "o": ["Разделение списка осуществляется с помощью общих реквизитов", "Нет такой возможности, список един для базы данных", "В списке пользователей можно создать группу пользователей"], "a": 0, "e": "Средство платформы — общий реквизит со свойством «Разделение пользователей». Справочник «Группы пользователей» в ERP — это БСП, а не платформа."}, {"q": "Объект конфигурации Константа...", "o": ["Предназначены для хранения постоянной информации (нет возможности изменить хранимое значение)", "Предназначены для хранения постоянной, условно-постоянной информации", "Предназначены для определения собственного типа значения", "Предназначены для определения фиксированного списка значений"], "a": 1, "e": "Константа хранит одно редко меняющееся значение (например, основная организация), но изменить его можно. Свой тип — это определяемый тип, фиксированный список — перечисление."}, {"q": "Для запрета режима непосредственного удаления предопределенных элементов справочника пользователем необходимо...", "o": ["в свойствах конфигурации снять флаг \"Разрешить непосредственное удаление предопределенных\"", "при определении роли для соответствующих объектов снять отметку у флага \"Интерактивное удаление предопределенных\"", "при определении роли для соответствующих объектов снять отметку у флага \"Интерактивное удаление\"", "в свойствах роли снять отметку у флага \"Разрешить интерактивное удаление предопределенных\"", "в свойствах роли снять отметку у флага \"Разрешить интерактивное удаление объектов\""], "a": 1, "e": "В роли у справочника есть отдельное право «Интерактивное удаление предопределенных». Просто «Интерактивное удаление» — для всех элементов. Раз вопрос про предопределённые — флаг со словом «предопределенных»."}, {"q": "Какие объекты используются при описании алгоритма?", "o": ["Объекты конфигурации", "Объекты встроенного языка", "Объекты информационной базы", "Варианты 1 и 3", "Верны все варианты"], "a": 1, "e": "Алгоритм — это код. В коде работают с Запрос, Массив, СправочникОбъект и т. п. — это объекты встроенного языка."}, {"q": "При создании нового Плана видов характеристик обязательно должны быть заполнены:", "o": ["Свойство \"Дополнительные значения характеристик\"", "Обязательно должны быть заполнены свойства \"Тип значения характеристик\" и \"Дополнительные значения характеристик\"", "Свойство \"Тип значения характеристик\"", "Оба свойства могут быть не заполнены"], "a": 2, "e": "Платформе нужно знать, каких типов могут быть значения характеристик. Справочник дополнительных значений — необязательный."}, {"q": "Внешняя обработка может быть включена в состав конфигурации:", "o": ["Как отчет", "Как обработка", "Варианты 1 и 2", "Варианты 1 и 2 (но возможна потеря функциональности)"], "a": 2, "e": "Внешнюю обработку можно вставить и как обработку, и как отчёт — без потерь. Оговорка про потерю функциональности — ловушка."}, {"q": "Какое максимальное количество видов документов позволяет создать система 1С:Предприятие 8 в процессе конфигурирования?", "o": ["Неограниченное", "Ограничивается свойством конфигурации \"Количество видов документов\", по умолчанию значение равно 50, можно увеличить до 150", "256, т.к. система не позволяет обрабатывать более 256 таблиц объектов", "50, считается, что при большем количестве видов документов их можно объединять используя понятие \"Операция документа\""], "a": 0, "e": "Ограничений на количество объектов метаданных нет. Свойства «Количество видов документов» не существует."}, {"q": "Какого вида клиентского приложения не существует в системе 1С:Предприятие 8?", "o": ["Мобильный клиент", "Толстый клиент", "Тонкий клиент", "Веб – клиент", "Варианты 2 и 3", "Существуют все перечисленные виды клиентских приложений"], "a": 5, "e": "Толстый, тонкий, веб и мобильный клиенты существуют. Выдуманного варианта в списке нет — значит «существуют все»."}, {"q": "Внешний отчет может быть включен в состав конфигурации:", "o": ["Как отчет", "Как обработка", "Варианты 1 и 2", "Варианты 1 и 2 (но возможна потеря функциональности)"], "a": 3, "e": "Для внешнего ОТЧЁТА — с оговоркой: превращаясь в обработку, отчёт теряет основную схему компоновки (СКД) и связанные с ней возможности. Сравни: внешняя ОБРАБОТКА — «1 и 2» без оговорки."}, {"q": "При настройке ограничений прав доступа (в ролях), при определении шаблонов:", "o": ["в них можно определить один параметр, значение которого будет передаваться при указании шаблона в конкретном ограничении доступа к данным", "в них можно определить любое количество параметров, значение которых будет передаваться при указании шаблона в конкретном ограничении доступа к данным", "параметры в шаблонах использовать нельзя", "определение шаблонов и заключается в описании параметров"], "a": 1, "e": "В тексте шаблона пишут #Параметр(1), #Параметр(2) и т. д. — количество не ограничено, значения подставляются при использовании шаблона."}, {"q": "Можно ли в системе 1С:Предприятии определить свой тип данных, например \"ЦенаНоменклатуры\"?", "o": ["Свой тип можно создать только в расширении конфигурации (с любым назначением)", "Такой возможности в платформе нет", "Да, для этого есть общие реквизиты", "Да, для этого есть определяемые типы", "Свой тип можно создать только в расширении конфигурации с назначением: \"Дополнение\""], "a": 3, "e": "Определяемый тип (ветка «Общие → Определяемые типы») задаёт набор типов под своим именем, и его можно указывать как тип реквизита. Расширение для этого не нужно."}, {"q": "Для каких целей может использоваться \"Толстый клиент\"?", "o": ["Использование прикладного решения", "Отладка прикладного решения", "Разработка прикладного решения", "Верны варианты 1 и 2", "Верны все варианты"], "a": 4, "e": "Конфигуратор — режим толстого клиента, поэтому в толстом клиенте можно и работать, и отлаживать, и разрабатывать. Сравни: тонкий клиент — только «1 и 2»."}, {"q": "Определите отличие между вводом документа копированием и вводом \"на основании\"", "o": ["Копирование – создание нового объекта копированием существующего, причем того же типа и с идентичными данными, а ввод на основании обычно создает объект другого типа, данные которого лишь функционально зависят от \"объекта-основания\"", "Между этими операциями нет отличия", "При копировании документ создается и сразу записывается в информационную базу, а при вводе на основании пользователь может изменить перенесенные в новый созданный объект данные и только затем записать объект", "Варианты 1 и 3"], "a": 0, "e": "Копия — тот же вид документа и те же данные. На основании — обычно другой вид (Заказ → Реализация), а данные заполняются по логике обработчика ОбработкаЗаполнения. Копия тоже не записывается сразу, поэтому вариант 3 неверен."}, {"q": "Если рабочие серверы кластера 1С:Предприятие работают с использованием разных операционных систем то:", "o": ["ни каких ограничений на используемые СУБД нет", "с MS SQL сервер можно работать с рабочего сервера под управлением операционных систем Windows, с другими СУБД как из-под Windows, так и из-под Linux", "с MS SQL сервер можно работать с рабочего сервера под управлением операционных систем Windows, с другими СУБД только из-под Linux"], "a": 1, "e": "Доступ к MS SQL у сервера 1С есть только под Windows. PostgreSQL, DB2 и Oracle доступны и из Windows, и из Linux."}, {"q": "Произвольная (к примеру по прикладным механизмам) классификация объектов конфигурации осуществляется с помощью:", "o": ["свойства \"Классификационная группа\" у объекта конфигурации", "с помощью объекта конфигурация Подсистемы", "заданием порядковых номеров объектов конфигурации по разным шаблонам", "Варианты 1 и 3", "Верны все варианты"], "a": 1, "e": "Подсистемы группируют объекты конфигурации по смыслу (Продажи, Склад…); один объект может входить в несколько подсистем. По ним же строится командный интерфейс."}, {"q": "Сколько информационных баз может быть с одной и той же конфигурацией?", "o": ["Только одна", "Только две (рабочая и демонстрационная)", "Неограниченно", "Определяется комплектом поставки прикладного решения", "Определяется в настройках конфигурации"], "a": 2, "e": "Одну конфигурацию можно загрузить в сколько угодно баз: рабочая, копии, тестовые, по организациям."}, {"q": "В механизме полнотекстового поиска для поиска с учетом синонимов слова \"алый\" используется выражение:", "o": ["(алый)", "'алый'", "!алый", "\"алый\""], "a": 2, "e": "Восклицательный знак включает синонимы. Для справки: ~ — нечёткий поиск (в 8.3; в старых шпаргалках встречается #), * — по началу слова, кавычки — точная фраза."}, {"q": "Назовите основное назначение объектов типа \"Документ\"?", "o": ["Предназначены для отражения в системе условно-постоянной информации, например, данных о контрагентах", "Предназначены для хронологического отражения в системе событий предметной области, например, хозяйственных операций предприятия", "Предназначены только для отражения хозяйственных операций в регистрах учета, например, в регистрах бухгалтерии", "Предназначены только для печати на бумажных носителях унифицированных форм, например, счетов-фактур, расходных накладных (по данным содержащимся в документе)", "Предназначены только для хранения и последующей обработки больших объемов данных в целях получения информации нового качества, например, формирование книги покупок, книги продаж по учету НДС"], "a": 1, "e": "Документ фиксирует событие во времени (у него есть дата). Условно-постоянная информация — это справочники. Варианты со словом «только» — ловушки."}, {"q": "При необходимости внести в механизм полнотекстового поиска свой дополнительный словарь (синонимы, специфичные для какого-либо рода деятельности) его можно включить в конфигурацию:", "o": ["как константу", "как общий макет", "как параметр сеанса", "верны ответы 1 и 2", "верны ответы 1 и 2 и 3"], "a": 3, "e": "Словарь — двоичные данные: их хранят в общем макете или в константе с типом ХранилищеЗначения. Параметр сеанса живёт только пока идёт сеанс."}, {"q": "При каких условиях необходима установка свойства \"Оперативное проведение\" документа в значение \"Запретить\"?", "o": ["Когда документ ориентируется на проведение в реальном (настоящем) времени.", "Когда документ проводится только по регистрам бухгалтерии", "Когда документ ориентируется на проведение прошлым временем (\"задним числом\").", "Когда документ ориентируется на проведение будущим временем.", "Верны варианты 3 или 4"], "a": 3, "e": "При «Разрешить» документ с будущей датой провести нельзя. Если документ нужно проводить будущим числом — оперативное проведение запрещают. Задним числом проводить можно при любой настройке."}, {"q": "Назовите основное назначение объектов типа \"ЖурналДокументов\"", "o": ["Журнал документов представляет собой таблицу для хранения всех документов в едином списке, упорядоченном по хронологии. Отличие журналов друг от друга заключается в составе дополнительных граф", "Объект \"Журнал документов\" представляет собой представление списка документов определенного вида, под журнал документов таблица в базе данных не создается", "Журнал представляет собой отдельную таблицу, содержащую список документов определенного вида, упорядоченный по хронологии. Каждый вид документа должен быть зарегистрирован в одном из журналов документов, иначе пользователь не сможет работать со списком документов этого вида", "Журнал представляет собой отдельную таблицу, содержащую список документов определенных видов, собранных по принципу общности отражаемых событий предметной области и предоставляемых пользователю в едином, упорядоченном по хронологии списке"], "a": 3, "e": "Журнал объединяет документы РАЗНЫХ видов по смыслу (например, все складские) в один хронологический список. Регистрировать каждый вид в журнале не обязательно — у документа есть свой список."}, {"q": "Для объектов конфигурации \"Бизнес-процесс\" и \"Задача\" выберите верное утверждение:", "o": ["В конфигурации может быть только один Бизнес-процесс и одна Задача", "Бизнес-процесс может связываться одновременно с несколькими Задачами", "Каждая Задача может использоваться в нескольких Бизнес-процессах", "Варианты 2 и 3", "При конфигурировании нет возможности определить связь между Бизнес-процессами и Задачами (она реализуется программно)"], "a": 2, "e": "У бизнес-процесса в свойствах указывается ровно одна Задача, но одну Задачу могут использовать несколько бизнес-процессов. Поэтому «2 и 3» неверно."}, {"q": "Как разделить механизм нумерации документов по филиалам для многофирменного учета?", "o": ["Используя механизм префиксации (программно)", "С помощью механизма разделения данных", "Варианты 1 и/или 2", "Разделение нумератора для многофирменного учета не поддерживается"], "a": 2, "e": "Работают оба способа: префикс к номеру дописывают в коде (ПриУстановкеНовогоНомера), а разделение данных даёт каждой области свою нумерацию."}, {"q": "Для каких целей может использоваться \"Тонкий клиент\"?", "o": ["Использование прикладного решения", "Отладка прикладного решения", "Разработка прикладного решения", "Верны варианты 1 и 2", "Верны все варианты"], "a": 3, "e": "В тонком клиенте работают и запускают отладку. Разрабатывать в нём нельзя — конфигуратор есть только в толстом клиенте."}, {"q": "Хранение бинарных данных в конфигурации:", "o": ["невозможно", "реализовано с помощью макетов", "обеспечивается константами и реквизитами с типом данных \"Хранилище значений\"", "верны варианты 2 и 3"], "a": 1, "e": "В самой конфигурации двоичные данные хранятся в макетах. Хранилище значений в константах и реквизитах — это хранение в информационной базе, а не в конфигурации."}, {"q": "Что содержится в объекте информационной базы при редактировании существующего в базе элемента справочника с табличными частями?", "o": ["Данные реквизитов", "Ссылка на элемент справочника", "Строки табличных частей", "Варианты 1 и 3", "Верны все варианты"], "a": 4, "e": "Существующий элемент уже записан, поэтому у него есть и реквизиты, и строки ТЧ, и ссылка. Сравни: у НОВОГО элемента ссылки ещё нет — «1 и 3»."}, {"q": "Какую конфигурацию можно изменять интерактивно в конфигураторе? (есть вариант с расширением)", "o": ["Основная конфигурация", "Конфигурация расширения", "Конфигурация базы данных", "Варианты 1 или 2", "Варианты 1 или 2 или 3"], "a": 3, "e": "Править можно основную конфигурацию и расширения. Конфигурация БД обновляется из основной по F7, напрямую её не меняют."}, {"q": "Что произойдет, если удалить предопределенный элемент в режиме 1С:Предприятие?", "o": ["Элемент будет удален только в 1С:Предприятие", "Элемент будет удален и в Конфигураторе, и в 1С:Предприятие", "Будет выдано предупреждение об ошибке"], "a": 0, "e": "С 8.3.3 предопределённые элементы — обычные записи в базе. Удаление в Предприятии убирает запись из базы, а описание в конфигурации остаётся. Ошибки не будет, если есть права. Сравни: удаление в КОНФИГУРАТОРЕ → элемент в базе помечается на удаление."}, {"q": "Отчет и обработка...", "o": ["находятся в разных ветвях дерева конфигурации, имеют разную структуру и назначение", "отчет предназначен исключительно для вывода учетной информации, обработка - для преобразования учетных данных", "находятся в разных ветвях дерева конфигурации, имеют схожую структуру, предполагается, что отчет выводит данные, обработка - изменяет (хотя с помощью обработки можно выводить данные и наоборот)"], "a": 2, "e": "Структура у отчёта и обработки почти одинаковая. Слово «исключительно» — ловушка: обработкой тоже можно выводить данные."}, {"q": "Роль как объект конфигурации отражает:", "o": ["статус и сферу ответственности ее носителя как сотрудника компании", "совокупность доступных определенному пользователю объектов в среде \"1С:Предприятие\"", "совокупность прав действий в среде \"1С:Предприятие\" с возможностью присвоения конкретному пользователю", "набор параметров пользователя"], "a": 2, "e": "Роль — набор прав (чтение, добавление, проведение…), который назначают пользователю. Ключевые слова — «прав действий»."}, {"q": "Сколько конфигураций может существовать в прикладном решении?", "o": ["Три", "Две", "Одна", "Сколько угодно"], "a": 3, "e": "Ключевое слово — «может». Кроме основной и конфигурации БД бывают конфигурации поставщиков и расширения, их число не ограничено. Не путай с вопросом «сколько ОБЯЗАТЕЛЬНО должно существовать» — там ответ «Две»."}, {"q": "Картинки для прикладного решения могут браться из ...", "o": ["библиотеки картинок технологической платформы", "библиотеки картинок конфигурации", "из файловой системы", "Варианты 1 и 2", "Верны все варианты"], "a": 4, "e": "Можно взять стандартную картинку платформы, общую картинку конфигурации или загрузить картинку из файла."}, {"q": "При обращении к неинициализированному параметру сеанса:", "o": ["такая ситуация не возможна, параметры сеанса не могут быть неинициализированными", "будет выполнен обработчик \"Установка параметров сеанса\" и, если значение не будет инициализировано, то будет установлено значение по умолчанию для указанного в параметре сеанса типа значения", "будет вызвано исключение", "будет выполнен обработчик \"Установка параметров сеанса\" и, если значение не будет инициализировано, то оно будет установлено в \"Неопределено\"", "будет выполнен обработчик \"Установка параметров сеанса\" и, если значение не будет инициализировано, будет вызвано исключение"], "a": 4, "e": "Сначала платформа вызывает УстановкаПараметровСеанса. Если код так и не задал значение — ошибка «Параметр сеанса не установлен». Ни значения по умолчанию, ни «Неопределено» платформа не подставляет."}, {"q": "Из чего состоит основная конфигурация?", "o": ["Объекты конфигурации", "Объекты встроенного языка", "Объекты информационной базы", "Верны ответы 1 и 3", "Верны все варианты"], "a": 0, "e": "Конфигурация — это описание (справочник «Номенклатура» в дереве). Объекты ИБ — сами данные (конкретный товар), они лежат в базе, а не в конфигурации."}, {"q": "Выберите верный набор ассоциаций \"Сущность системы\" - \"тип файла\":", "o": ["внешняя обработка - \"epf\", внешний отчет – \"erf\", конфигурация – \"cf\"", "внешняя обработка - \"ert\", внешний отчет – \"mxl\", конфигурация – \"pfl\"", "внешняя обработка - \"ert\", внешний отчет – \"erf\", конфигурация – \"cfu\"", "внешняя обработка - \"epf\", внешний отчет – \"mxl\", конфигурация – \"cfu\"", "внешняя обработка - \"epf\", внешний отчет – \"erf\", конфигурация – \"1CD\""], "a": 0, "e": "epf — External Processing File, erf — External Report File, cf — Configuration File. 1CD — это файл самой информационной базы, mxl — табличный документ, cfu — файл обновления."}, {"q": "Какие варианты подчинения существуют в системе 1С:Предприятие 8?", "o": ["группам", "элементам", "группам и элементам", "Варианты 1 и 3", "Варианты 2 и 3", "Верны все указанные ответы"], "a": 5, "e": "Свойство «Использование подчинения» подчинённого справочника: элементам, группам, группам и элементам — существуют все три."}, {"q": "Объект конфигурации Перечисление...", "o": ["прикладной объект, значения которого задаются в Конфигураторе.", "может хранить различные типы значений", "для него могут быть заданы форма списка и выбора", "верны все указанные ответы", "верны ответы 1 и 3"], "a": 4, "e": "Значения перечисления задаются только в конфигураторе, формы списка и выбора у него есть. Хранить разные типы значений перечисление не может."}, {"q": "При создании нового документа и отказа от его записи номер документа:", "o": ["не может быть использован другим документом", "может быть использован другим документом", "может или не может быть использован повторно, зависит от значения соответствующего свойства конфигурации", "даже не назначался документу (назначение происходит при записи)"], "a": 2, "e": "Поведение задаётся настройкой: номер можно резервировать сразу (тогда после отказа он «сгорает») или назначать при записи. Варианты 1 и 4 сайт засчитал как ошибки."}, {"q": "Что содержится в объекте информационной базы при редактировании нового элемента справочника с табличными частями?", "o": ["Данные реквизитов", "Ссылка на элемент справочника", "Строки табличных частей", "Верны ответы 1 и 3", "Верны все варианты"], "a": 3, "e": "Ключевое слово — «нового». Реквизиты и строки ТЧ есть, а ссылки ещё нет: она появится только при первой записи (Ссылка.Пустая() = Истина)."}, {"q": "Назовите основную функцию нумератора документов?", "o": ["Определяет тип номера, периодичность нумерации в документе, если у него снят флажок в свойстве \"Автонумерация\"", "Для реализации префиксации номеров документа", "Сквозная нумерация документов разного вида", "Для задания типа номера, периодичности нумерации документа"], "a": 2, "e": "Нумератор нужен, когда документы РАЗНЫХ видов берут номера из ОДНОЙ серии. Тип номера и периодичность есть и у самого документа, префиксы ставят в коде."}, {"q": "Что разрешено разработчикам прикладных решений в системе 1С:Предприятие 8?", "o": ["Изменять функциональность типовых тиражных решений", "Создавать собственные прикладные решения", "Изменять компоненты технологической платформы", "Правильны ответы 1 и 2", "Верны все варианты"], "a": 3, "e": "Типовые конфигурации открыты для доработки, свои решения создавать можно. А платформа — закрытый продукт фирмы 1С, её менять нельзя."}, {"q": "При заведении значения объекта конфигурации \"Перечисление\":", "o": ["Указывается имя, синоним, комментарий", "Может определяется состав реквизитов", "Может определяется состав табличных частей", "Варианты 1 и 2", "Верны все варианты"], "a": 0, "e": "У значения перечисления нет реквизитов и ТЧ — только имя (для кода), синоним (для пользователя) и комментарий. Не путать с вопросом про перечисление целиком."}, {"q": "При настройке ограничения прав доступа на уровне записей и полей базы данных значения параметров для условий определяются...", "o": ["как переменные, определенные в модуле приложения", "как переменные, определенные в модуле приложения с ключевым словом Экспорт", "как параметры сеанса", "как константы", "как переменные определяемые в соответствующем обработчике события"], "a": 2, "e": "Условие RLS (ГДЕ Организация = &ТекущаяОрганизация) выполняется на сервере и берёт значения из параметров сеанса — у каждого пользователя своё значение. Константа одна на всю базу, переменные модуля приложения живут на клиенте."}, {"q": "Механизм \"История данных\" (версионирование) позволяет настраивать хранение истории данных до:", "o": ["объекта конфигурации", "табличной части", "реквизита", "Варианты 1 и 2", "Варианты 1 и 2, и 3"], "a": 4, "e": "Историю можно настроить на уровне объекта, табличной части и отдельного реквизита — например, исключить реквизит из хранения."}, {"q": "Для каких компонент существуют сетевые ключи защиты?", "o": ["Клиентское приложение", "Мобильный клиент", "Сервер 1С:Предприятия", "Правильны ответы 1 и 3", "Правильны ответы 1 и 2", "Верны все варианты"], "a": 4, "e": "Сетевой ключ раздаёт лицензии пользователям по сети — и обычным клиентам, и мобильному клиенту. Ключ сервера ставится прямо в сервер и сетевым не бывает. В приложении-тренажёре вариант другой (без мобильного клиента) — не путай."}, {"q": "Каким может быть тип данных ресурса у регистра сведений?", "o": ["Один из примитивных типов данных", "Ссылочные типы данных", "Хранилище значений", "Составной тип данных", "Верны все перечисленные ответы", "Верны ответы 1 и 2"], "a": 4, "e": "Регистр сведений хранит любую информацию, поэтому ресурс может быть любого типа. Числом обязан быть ресурс регистра накопления, а не сведений."}, {"q": "Объект конфигурации Отчет...", "o": ["может быть сохранён во внешний файл как внешняя обработка", "может сравниваться с внешней обработкой, формируя отчет в печатной форме", "может быть добавлен в конфигурацию из внешней обработки", "верны все указанные ответы"], "a": 3, "e": "Отчёт можно сохранить во внешний файл, сравнить с внешним и заменить им — всё через контекстное меню отчёта в конфигураторе."}, {"q": "Для каких объектов конфигурации возможен ввод предопределенных значений?", "o": ["Справочники", "Документы", "Планы видов характеристик, планы счетов, планы видов расчета", "Справочники, планы видов характеристик", "Справочники, планы видов характеристик, планы счетов, планы видов расчета", "Все вышеперечисленные"], "a": 4, "e": "Предопределённые элементы бывают у справочников и у всех «планов» (ПВХ, планы счетов, планы в const KEY = "prof1c-t1-77";
let store = {res:{}, bad:[]};
try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s && s.res) store = s; }catch(e){}
const HKEY = KEY + "_h";
let hist = {a:[], q:{}};   // a: [ts, mode, total, answered, ok]; q: idx -> [right, wrong]
try{ const h = JSON.parse(localStorage.getItem(HKEY)||"null"); if(h && h.a) hist = h; }catch(e){}
function saveHist(){
  if(hist.a.length>40) hist.a = hist.a.slice(-40);
  const s = JSON.stringify(hist);
  try{ localStorage.setItem(HKEY, s); }catch(e){}
  try{ if(TG && TG.CloudStorage) TG.CloudStorage.setItem(HKEY, s); }catch(e){}
}
let attemptIdx = null;
const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} cloudSave(); };

let mode = "all", shuffle = false, order = [], pos = 0, session = {}; // session: idx -> chosen original index
const $ = id => document.getElementById(id);

function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const optOrder = {};
function buildOrder(){
  const all = BANK.map((_,i)=>i);
  if(mode==="bad"){ order = all.filter(i=>store.res[i]===false); }
  else if(mode==="exam"){ order = shuffled(all).slice(0,14); }
  else order = all;
  session = {}; pos = 0; attemptIdx = null;
  for(const i of order) optOrder[i] = shuffle ? shuffled(BANK[i].o.map((_,k)=>k)) : BANK[i].o.map((_,k)=>k);
}

function renderStrip(){
  const s = $("strip"); s.innerHTML = "";
  order.forEach((qi,p)=>{
    const b = document.createElement("button");
    b.className = "dot";
    const r = session[qi]!==undefined ? (session[qi]===BANK[qi].a) : undefined;
    if(r===true) b.classList.add("ok"); if(r===false) b.classList.add("bad");
    if(p===pos) b.classList.add("cur");
    b.title = "Вопрос " + (p+1);
    b.setAttribute("aria-label","Вопрос "+(p+1));
    b.onclick = ()=>{ pos=p; render(); };
    s.appendChild(b);
  });
  const vals = order.map(qi=>session[qi]);
  $("sTot").textContent = order.length;
  $("sAns").textContent = vals.filter(v=>v!==undefined).length;
  $("sOk").textContent = order.filter(qi=>session[qi]===BANK[qi].a).length;
  $("sBad").textContent = order.filter(qi=>session[qi]!==undefined && session[qi]!==BANK[qi].a).length;
}

function render(){
  if(mode==="res"){ return renderResults(); }
  $("strip").hidden=false;
  renderStrip();
  const card = $("card");
  if(!order.length){
    card.className="card done";
    card.innerHTML = '<p class="big">0</p><p>Ошибок нет — повторять нечего.</p><div class="row"><button class="btn primary" id="goAll">Пройти все вопросы</button></div>';
    $("goAll").onclick=()=>setMode("all"); return;
  }
  if(pos>=order.length){ return renderDone(); }
  card.className="card";
  const qi = order[pos], Q = BANK[qi], chosen = session[qi];
  const ord = optOrder[qi];
  let h = '<div class="qnum">ВОПРОС '+(pos+1)+' ИЗ '+order.length+'</div><h2 class="qtext">'+esc(Q.q)+'</h2><ul class="opts">';
  ord.forEach((k,n)=>{
    let cls="opt";
    if(chosen!==undefined){
      if(k===Q.a) cls+=" right"; else if(k===chosen) cls+=" wrong"; else cls+=" dim";
    }
    h += '<li><button class="'+cls+'" data-k="'+k+'" data-n="'+(n+1)+'"'+(chosen!==undefined?' disabled':'')+'>'+esc(Q.o[k])+'</button></li>';
  });
  h += '</ul>';
  if(chosen!==undefined){
    const ok = chosen===Q.a;
    h += '<div class="expl '+(ok?'good':'bad')+'"><strong>'+(ok?'Верно.':'Неверно. Правильный ответ: «'+esc(Q.o[Q.a])+'»')+'</strong>'+esc(Q.e)+'</div>';
  }
  h += '<div class="nav"><button class="btn" id="prev"'+(pos===0?' disabled':'')+'>← Назад</button><button class="btn primary" id="next">'+(pos===order.length-1?'Завершить':'Дальше →')+'</button></div>';
  card.innerHTML = h;
  card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $("prev").onclick=()=>{ if(pos>0){pos--;render();} };
  $("next").onclick=()=>{ pos++; render(); };
}

function answer(k){
  const qi = order[pos]; if(session[qi]!==undefined) return;
  session[qi]=k;
  const ok = k===BANK[qi].a;
  store.res[qi]=ok; save(); haptic(ok);
  const c = hist.q[qi] || [0,0]; c[ok?0:1]++; hist.q[qi]=c;
  const answered = order.filter(i=>session[i]!==undefined).length;
  const right = order.filter(i=>session[i]===BANK[i].a).length;
  const rec = [Math.floor(Date.now()/1000), mode, order.length, answered, right];
  if(attemptIdx===null){ hist.a.push(rec); attemptIdx = hist.a.length-1; } else hist.a[attemptIdx] = rec;
  saveHist();
  render();
}

function renderDone(){
  const card=$("card"); card.className="card done";
  const n=order.length, ok=order.filter(qi=>session[qi]===BANK[qi].a).length, ans=order.filter(qi=>session[qi]!==undefined).length;
  let verdict="";
  if(mode==="exam") verdict = ok>=12 ? "Сдано: нужно 12 из 14." : "Не сдано: нужно 12 из 14.";
  card.innerHTML='<p class="big">'+ok+' / '+n+'</p><p>Отвечено '+ans+' из '+n+'. '+verdict+'</p>'+
    '<div class="row"><button class="btn primary" id="again">Ещё раз</button><button class="btn" id="toBad">Повторить ошибки</button></div>';
  $("again").onclick=()=>{ buildOrder(); render(); };
  $("toBad").onclick=()=>setMode("bad");
  renderStrip();
}

  const exams=hist.a.filter(r=>r[1]==="exam" && r[3]===r[2]);

  let h='<div class="kpis">'+
    '<div class="kpi"><b>'+(totR+totW?Math.round(100*totR/(totR+totW)):0)+'%</b><span>верных ответов за всё время</span></div>'+
    '<div class="kpi"><b>'+mastered+'/'+BANK.length+'</b><span>вопросов сейчас решены верно</span></div>'+
    '<div class="kpi"><b>'+passed+'/'+exams.length+'</b><span>экзаменов сдано (12+ из 14)</span></div></div>';
  h+='<h3>Попытки</h3>';
  if(!A.length) h+='<p class="muted">Пока пусто. Ответь хотя бы на один вопрос — попытка появится здесь.</p>';
  else{
    h+='<div style="overflow-x:auto"><table class="hist"><thead><tr><th>Когда</th><th>Режим</th><th style="text-align:right">Верно</th><th style="text-align:right">%</th></tr></thead><tbody>';
    for(const r of A.slice(0,20)){
      const pct=r[3]?Math.round(100*r[4]/r[3]):0;
      let cls=""; if(r[1]==="exam" && r[3]===r[2]) cls = r[4]>=12?"pass":"fail";
      h+='<tr><td>'+fmtDate(r[0])+'</td><td>'+(MODE_NAME[r[1]]||r[1])+(r[3]<r[2]?' <span class="muted">(не до конца)</span>':'')+'</td><td class="num '+cls+'">'+r[4]+'/'+r[3]+'</td><td class="num">'+pct+'</td></tr>';
    }
    h+='</tbody></table></div>';
  }
  const hard=Object.keys(hist.q).map(k=>[+k,hist.q[k][0],hist.q[k][1]]).filter(x=>x[2]>0 && BANK[x[0]]).sort((a,b)=>b[2]-a[2]||a[1]-b[1]).slice(0,7);
  h+='<h3>Самые трудные вопросы</h3>';
  if(!hard.length) h+='<p class="muted">Ошибок пока не было.</p>';
  else{ h+='<ul class="hard">'; for(const x of hard) h+='<li><span class="cnt">✕'+x[2]+' ✓'+x[1]+'</span><span>'+esc(BANK[x[0]].q)+'</span></li>'; h+='</ul>'; }
  h+='<div class="nav"><button class="btn primary" id="goBad">Повторить ошибки</button><button class="btn" id="clr">'+(confirmClear?'Точно удалить историю?':'Очистить историю')+'</button></div>';
  card.innerHTML=h;
  $("goBad").onclick=()=>setMode("bad");
  $("clr").onclick=()=>{ if(!confirmClear){confirmClear=true; renderResults(); return;} confirmClear=false; hist={a:[],q:{}}; saveHist(); renderResults(); };
  $("sTot").textContent=BANK.length; $("sAns").textContent=totR+totW; $("sOk").textContent=totR; $("sBad").textContent=totW;
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function setMode(m){
  mode=m;
  $("mAll").setAttribute("aria-pressed", m==="all");
  $("mBad").setAttribute("aria-pressed", m==="bad");
  $("mExam").setAttribute("aria-pressed", m==="exam");
  $("mRes").setAttribute("aria-pressed", m==="res");
  confirmClear=false;
  if(m!=="res") buildOrder();
  render();
}
$("mAll").onclick=()=>setMode("all");
$("mBad").onclick=()=>setMode("bad");
$("mExam").onclick=()=>setMode("exam");
$("mRes").onclick=()=>setMode("res");
$("shuf").onclick=()=>{ shuffle=!shuffle; $("shuf").setAttribute("aria-pressed",shuffle); if(mode!=="res") buildOrder(); render(); };
$("reset").onclick=()=>{ store={res:{},bad:[]}; save(); if(mode==="res") setMode("all"); else { buildOrder(); render(); } };

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(mode==="res") return;
  const qi=order[pos];
  if(/^[1-6]$/.test(e.key) && qi!==undefined && session[qi]===undefined){
    const k=optOrder[qi][+e.key-1]; if(k!==undefined) answer(k);
  } else if((e.key==="Enter"||e.key==="ArrowRight") && pos<order.length){ pos++; render(); }
  else if(e.key==="ArrowLeft" && pos>0){ pos--; render(); }
});

cloudLoad(()=>{ buildOrder(); render(); });
</script>

</body>
</html>
